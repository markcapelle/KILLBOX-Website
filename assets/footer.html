<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <footer>
        <section class="logo-container">
            <img src="assets/images/Logo.png" alt="KILLBOX logo" class="logo">
        </section>

        <div class="center-group">
            <section class="socials">
                <h3>Socials</h3>
                <div class="icon-row">
                    <a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-square-facebook"></i></a>
                    <a href="https://x.com/" target="_blank"><i class="fa-brands fa-square-x-twitter"></i></a>
                    <a href="https://store.steampowered.com/" target="_blank"><i class="fa-brands fa-square-steam"></i></a>
                </div>
            </section>

            <section class="contactus">
                <h3>Contact Us</h3>
                <div class="icon-row">
                    <a href="mailto:user@domain.ie"><i class="fa-solid fa-envelope"></i></a>
                    <a href="tel:+1234567890"><i class="fa-solid fa-phone"></i></a>
                </div>
            </section>
        </div>

        <section class="legal">
            <p>KILLBOX game © 2025 Mark Van Capelle. All rights reserved.</p>
        </section>
    </footer>

</body>
</html>
