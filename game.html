<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Page</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Script line for FontAwesome Icons -->
    <script src="https://kit.fontawesome.com/a1521aa5e9.js" crossorigin="anonymous"></script>
    
    <!-- Favicon created through Favicon.io -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>
<body>
    <div id="Banner"><script src="assets/scripts/loader.js"></script></div>
    
    <div id="Navigation"><script src="assets/scripts/loader.js"></script></div>
    
    <main>
        <h1>Game Page</h1>
 
        <div class="game-wrapper">
            <div id="game-viewport">
            <!-- Killbox game will render here -->
            </div>
        </div>
        
        <div class="controls">
            <button id="left-btn">Left</button>
            <button id="shoot-btn">Shoot</button>
            <button id="right-btn">Right</button>
        </div>
        
        <div class="controls">
            <button id="play-btn">Play</button>
            <button id="pause-btn">Pause</button>
            <button id="quit-btn">Quit</button>
            <button id="audio-btn">
                <i></i>
            </button>
        </div>
        
        <!-- Scoreboard -->
        <div id="scoreboard-container">
            <h2>Scoreboard</h2>
            <table id="scoreboard">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Score</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <script src="assets/scripts/audio.js"></script>
        <script src="assets/scripts/game.js"></script>
        
    </main>
    
    <div id="Footer"><script src="assets/scripts/loader.js"></script></div>
    
</body>
</html>
